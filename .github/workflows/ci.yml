name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/torqus-ci:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Try pulling cached image
        id: pull
        continue-on-error: true
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: Build and push Docker image
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          push: true
          cache-from: type=gha,scope=torqus-ci
          cache-to: type=gha,mode=max,scope=torqus-ci

  build-and-test:
    needs: build-image
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        include:
          - preset: gcc-debug
            build_dir: build/gcc/debug

          - preset: clang-debug
            build_dir: build/clang/debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ needs.build-image.outputs.ref }}
          docker tag ${{ needs.build-image.outputs.ref }} torqus-ci:latest

      - name: Configure
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            ctest --test-dir ${{ matrix.build_dir }} --verbose
