name: Sanitize

on:
  schedule:
    # Every Monday 00:00 UTC. ASan/UBSan overhead on this library's heavy
    # N=1024 polynomial arithmetic is severe enough (minutes for a single
    # test that takes ~20s plain -- see the matrix filter below) that this
    # stays off the push/PR path entirely; a weekly cadence here, not every
    # PR, is the tradeoff that keeps it affordable.
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - preset: gcc-sanitize
            build_dir: build/gcc/sanitize

          - preset: clang-sanitize
            build_dir: build/clang/sanitize

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/torqus-build:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Try pulling cached image
        id: pull
        continue-on-error: true
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: Build and push Docker image
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          load: true
          push: true
          cache-from: type=gha,scope=torqus-build
          cache-to: type=gha,mode=max,scope=torqus-build

      - name: Tag image for local use
        run: docker tag ${{ steps.image.outputs.ref }} torqus-build:latest

      - name: Configure
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-build \
            cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-build \
            cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      # Only GateBootstrapCorrectnessTest's toy-parameter instantiation --
      # the full suite at production (N=1024) parameters is minutes-to-hours
      # slower under ASan/UBSan, and every other operation's own toy
      # instantiation is already covered through this same code path
      # (GateBootstrap composes BlindRotate + KeySwitch + SampleExtract).
      # See test/support/params.hpp for ToyParams and the comment on
      # gate_bootstrap_test.cpp's own ToyContext.
      - name: Test (GateBootstrap, toy parameters only)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-build \
            ctest --test-dir ${{ matrix.build_dir }} --output-on-failure \
              -R 'GateBootstrapCorrectnessTest.VerifyCorrectness<.*ModTorus<16u'
