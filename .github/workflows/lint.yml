name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/torqus-build:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Try pulling cached image
        id: pull
        continue-on-error: true
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: Build and push Docker image
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          load: true
          push: true
          cache-from: type=gha,scope=torqus-build
          cache-to: type=gha,mode=max,scope=torqus-build

      - name: Tag image for local use
        run: docker tag ${{ steps.image.outputs.ref }} torqus-build:latest

      - name: clang-format --dry-run
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-build \
            bash -lc "find include test \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror"

      - name: Configure (for compile_commands.json)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-build \
            cmake --preset clang-debug

      - name: clang-tidy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-build \
            bash -lc "find test -name '*.cpp' -print0 | xargs -0 -I{} clang-tidy -p build/clang/debug --header-filter='^/work/include/' --warnings-as-errors='*' {}"
