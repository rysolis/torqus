name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: torqus-ci:latest
          load: true
          cache-from: type=gha,scope=torqus-ci
          cache-to: type=gha,mode=max,scope=torqus-ci

      - name: clang-format --dry-run
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            bash -lc "find include test \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror"

      - name: Configure (for compile_commands.json)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            cmake --preset clang-debug

      - name: clang-tidy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            bash -lc "find test -name '*.cpp' -print0 | xargs -0 -I{} clang-tidy -p build/clang/debug --header-filter='^/work/include/' --warnings-as-errors='*' {}"
