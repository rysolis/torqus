name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/torqus-ci:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Try pulling cached image
        id: pull
        continue-on-error: true
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: Build and push Docker image
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          load: true
          push: true
          cache-from: type=gha,scope=torqus-ci
          cache-to: type=gha,mode=max,scope=torqus-ci

      - name: Tag image for local use
        run: docker tag ${{ steps.image.outputs.ref }} torqus-ci:latest

      - name: Configure
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            cmake --preset gcc-coverage

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            cmake --build --preset gcc-coverage -j$(nproc)

      - name: Test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            ctest --test-dir build/gcc/coverage

      - name: Capture coverage (lcov)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            bash -lc "
              lcov --capture --directory build/gcc/coverage --output-file coverage.info --ignore-errors mismatch,negative &&
              lcov --remove coverage.info '/usr/*' '*/test/*' --output-file coverage.info --ignore-errors unused
            "

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
