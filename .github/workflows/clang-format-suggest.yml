name: clang-format-suggester

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/torqus-ci:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Try pulling cached image
        id: pull
        continue-on-error: true
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: Build and push Docker image
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          load: true
          push: true
          cache-from: type=gha,scope=torqus-ci
          cache-to: type=gha,mode=max,scope=torqus-ci

      - name: Tag image for local use
        run: docker tag ${{ steps.image.outputs.ref }} torqus-ci:latest

      - name: Run clang-format
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            torqus-ci \
            bash -lc "find include test \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format -i"

      - name: Suggest changes
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: clang-format
          github_token: ${{ secrets.GITHUB_TOKEN }}
          filter_mode: diff_context
          fail_level: none
